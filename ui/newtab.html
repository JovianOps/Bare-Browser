<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <style>
    :root { color-scheme: dark; --bg:#141414; --fg:#ececec; --muted:#9a9a9a; --border:#2f2f2f; --input:#1b1b1b; }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    .wrap{width:min(680px,92vw);text-align:center} h1{font-size:28px;font-weight:600;margin:0 0 8px;letter-spacing:-0.02em} p{color:var(--muted);margin:0 0 24px}
    form{display:flex;gap:8px} input{flex:1;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--fg);font-size:14px;outline:none}
    input:focus{border-color:#555} button{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:#232323;color:var(--fg);cursor:pointer}
    .shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:20px}
    .s{display:block;padding:12px;border:1px solid var(--border);border-radius:10px;color:var(--muted);text-decoration:none;font-size:13px}
    .s:hover{color:var(--fg);background:#1b1b1b}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Nadir</h1>
    <p>Search the web or enter an address.</p>
    <form action="https://duckduckgo.com/" method="get">
      <input name="q" type="text" placeholder="Search DuckDuckGo" autofocus />
      <button type="submit">Search</button>
    </form>
    <div class="shortcuts">
      <a class="s" href="https://duckduckgo.com">DuckDuckGo</a>
      <a class="s" href="https://github.com">GitHub</a>
      <a class="s" href="https://news.ycombinator.com">Hacker News</a>
      <a class="s" href="https://en.wikipedia.org">Wikipedia</a>
    </div>
  </div>
</body>
</html>
