<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Error</title>
  <style>
    :root { color-scheme: dark; --bg:#141414; --fg:#ececec; --muted:#9a9a9a; --border:#2f2f2f; --card:#1b1b1b; }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}
    .card{width:min(720px,100%);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px}
    h1{margin:0 0 8px;font-size:24px;font-weight:600} p{margin:0 0 12px;color:var(--muted);line-height:1.5}
    .url{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;color:#cfcfcf;word-break:break-all;background:#111;padding:10px;border-radius:8px;border:1px solid var(--border);margin:16px 0}
    .actions{display:flex;gap:8px;margin-top:18px}
    button,a{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:#232323;color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;font-size:13px;cursor:pointer}
    button:hover,a:hover{background:#2a2a2a}
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Can't load this page</h1>
    <p id="message">The page could not be loaded. Check the address, your connection, or try again.</p>
    <div id="url" class="url" style="display:none"></div>
    <div class="actions">
      <button onclick="location.reload()">Retry</button>
      <a href="nadir://newtab">New Tab</a>
    </div>
  </div>
  <script>
    const p = new URLSearchParams(location.search);
    const url = p.get('url'); const msg = p.get('message');
    if (url) { const el = document.getElementById('url'); el.textContent = url; el.style.display = 'block'; }
    if (msg) document.getElementById('message').textContent = msg;
  </script>
</body>
</html>
