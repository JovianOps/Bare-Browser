name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-checks:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JS syntax
        run: |
          node --check ui/app.js
      - name: Validate JSON files
        run: |
          python3 -m json.tool src-tauri/tauri.conf.json > /dev/null
          python3 -m json.tool src-tauri/capabilities/default.json > /dev/null
          python3 -m json.tool package.json > /dev/null

  rust-check:
    name: Rust check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
