[package]
name = "bare-browser"
version = "0.1.0"
description = "Bare Browser - a lightweight Tauri v2 desktop browser shell"
authors = ["Bare Browser Contributors"]
edition = "2021"

[lib]
name = "bare_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
