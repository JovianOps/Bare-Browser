<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookmarks</title>
<style>
:root{color-scheme:dark;--bg:#141414;--fg:#ececec;--muted:#9a9a9a;--border:#2f2f2f;--card:#1b1b1b;--input:#101010}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px}h1{margin:0 0 6px;font-size:28px;font-weight:600}.sub{color:var(--muted);margin:0 0 20px}
.bar{display:flex;gap:8px;margin-bottom:16px}input{flex:1;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--input);color:var(--fg)}
button{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:#232323;color:var(--fg);cursor:pointer}button:hover{background:#2a2a2a}
.group{margin:18px 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);margin-bottom:8px}
.meta{flex:1;min-width:0}.title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.url{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{width:32px;padding:0}.empty{color:var(--muted);padding:24px 0}
</style></head><body><div class="wrap">
<h1>Bookmarks</h1><p class="sub">Saved pages stored locally.</p>
<div class="bar"><input id="q" type="text" placeholder="Search bookmarks"><button id="export">Export</button><button id="import">Import</button></div>
<div id="list"></div></div>
<script>
const invoke=window.__TAURI__?.core?.invoke; const $=id=>document.getElementById(id); let items=[];
function render(){const q=$('q').value.toLowerCase().trim(); const filtered=items.filter(i=>!q||(i.title||'').toLowerCase().includes(q)||(i.url||'').toLowerCase().includes(q)||(i.folder||'').toLowerCase().includes(q)); const list=$('list'); list.innerHTML='';
 if(!filtered.length){list.innerHTML='<div class="empty">No bookmarks found.</div>';return;}
 const groups={}; for(const b of filtered){(groups[b.folder||'']||=[]).push(b)}
 const folders=Object.keys(groups).sort((a,b)=>(a===''?-1:0)-(b===''?-1:0)||a.localeCompare(b));
 for(const f of folders){ if(f){const g=document.createElement('div'); g.className='group'; g.textContent=f; list.appendChild(g);} 
  for(const i of groups[f]){ const el=document.createElement('div'); el.className='item'; el.innerHTML=`<div class="meta"><div class="title"></div><div class="url"></div></div><button class="del">×</button>`;
   el.querySelector('.title').textContent=i.title||i.url; el.querySelector('.url').textContent=i.url;
   el.querySelector('.meta').style.cursor='pointer'; el.querySelector('.meta').onclick=()=>location.href=i.url;
   el.querySelector('.del').onclick=async()=>{items=items.filter(x=>x.id!==i.id); await invoke('storage_save_bookmarks',{bookmarks:items}); render();};
   list.appendChild(el);
  }
 }
}
async function load(){ if(!invoke) return; try{const d=await invoke('storage_get_data'); items=d.bookmarks||[]; render();}catch(e){} }
$('q').oninput=render;
$('export').onclick=async()=>{ try{const html=await invoke('storage_export_bookmarks_html'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'})); a.download='nadir-bookmarks.html'; a.click(); }catch(e){} };
$('import').onclick=()=>{ const inp=document.createElement('input'); inp.type='file'; inp.accept='.html,.htm'; inp.onchange=async()=>{const f=inp.files?.[0]; if(!f) return; const html=await f.text(); try{items=await invoke('storage_import_bookmarks_html',{html}); render();}catch(e){}}; inp.click(); };
load();
</script></body></html>
